{% extends "base.html" %}

{% block content %}
  <h1 class="d-flex justify-content-between align-items-center">
    Tag list
    <a href="{% url 'todo:tag-create' %}" class="btn btn-primary">Add Tag</a>
  </h1>
  {% if tag_list %}
    <table class="table">
      <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">NAME</th>
        <th scope="col">UPDATE</th>
        <th scope="col">DELETE</th>
      </tr>
      </thead>
      <tbody>
      {% for tag in tag_list %}
        <tr>
          <td>{{ tag.id }}</td>
          <td>{{ tag.name }}</td>
          <td>
            <a href="{% url 'todo:tag-update' pk=tag.id %}" class="btn btn-secondary">
              UPDATE
            </a>
          </td>
          <td>
            <a href="{% url 'todo:tag-delete' pk=tag.id %}" class="btn btn-secondary">
              DELETE
            </a>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>
      Sorry, no tags found.
    </p>
  {% endif %}
{% endblock %}
